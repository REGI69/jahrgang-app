name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Zwei Schritte statt einem: Das Paket wird im ersten Job hochgeladen und erst im zweiten
# veröffentlicht. So ist es bei GitHub registriert, bevor die Veröffentlichung danach fragt
# (vorher scheiterte sie oft mit «No artifacts named github-pages were found»).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Website-Dateien zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons raetsel rg-consulting _site/
          rm -f _site/icons/generate_icon.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
