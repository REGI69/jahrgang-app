<style>
/* Leitungen: Klemmenplan auf einem hellen Schemablatt. Eigene Gestaltung, nur Systemschriften.
   Bildsprache: Reihenklemmen mit Schraube und Schild, dünne isolierte Adern mit rechtwinkliger Führung und dunkler Kontur,
   freie Felder tragen ein Lötauge, das Blatt hat ein feines Raster, Spalten und Zeilen sind am Blattrand beschriftet. */
:root{
  --lt-blatt:#ffffff;            /* Schemablatt (Brettgrund) */
  --lt-kontur:#152033;           /* Kontur von Adern und Klemmen */
  --lt-raster:#d0d9e7;           /* Feldlinien */
  --lt-raster-fein:#e9eef6;      /* feines Zwischenraster */
  --lt-kreuz:#8292ad;            /* Passkreuze an den Feldecken, 3.1:1 zum Blatt */
  --lt-auge:#6b7c98;             /* Lötauge in freien Feldern, 4.2:1 zum Blatt */
  --lt-metall:#dbe2ec;           /* Stift der Aderendhülse */
}
#spiel{gap:12px}
.lt-werte{width:100%;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.lt-wert{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:7px 11px;border-radius:14px;background:var(--rg-flaeche);border:1px solid var(--rg-linie);box-shadow:var(--rg-schatten-klein);line-height:1.2;transition:background .25s,border-color .25s}
.lt-wert b{font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.lt-wert span{font-size:.7rem;color:var(--rg-leise)}
.lt-wert.voll{border-color:var(--rg-gruen);background:var(--rg-gruen-hell)}
.lt-wert.voll b::after{content:" ✓";color:var(--rg-gruen);font-size:.95rem}
.lt-zeit{min-width:72px;text-align:right;align-items:flex-end}

.lt-brett{--lt-min:220px;position:relative;flex:none;margin-top:3px;width:min(100%,max(var(--lt-min),calc(100vh - 290px)));aspect-ratio:1;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:var(--lt-blatt);border-radius:12px;box-shadow:0 0 0 1px var(--rg-linie),0 1px 2px rgba(21,32,51,.08),0 12px 30px rgba(21,32,51,.13);transition:box-shadow .4s}
@supports (height:100dvh){.lt-brett{width:min(100%,max(var(--lt-min),calc(100dvh - 290px)))}}
@media(min-height:500px){.lt-brett{--lt-min:280px}}   /* niedrige Hochformat-Fenster: Felder bleiben auch bei 7×7 mindestens 40 px gross */
.lt-brett.geloest{box-shadow:0 0 0 2px var(--rg-gruen),0 1px 2px rgba(21,32,51,.08),0 12px 30px rgba(8,122,102,.2)}
.lt-brett svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;border-radius:12px;font-family:inherit}
/* Blattrand: Spalten 1–7 oben, Zeilen a–g links, ausserhalb des Bretts */
.lt-koord{position:absolute;display:flex;pointer-events:none;color:var(--rg-leise);font-size:10px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.lt-koord span{flex:1;display:grid;place-items:center}
.lt-koord-oben{left:0;right:0;bottom:100%;height:13px}
.lt-koord-links{top:0;bottom:0;right:100%;width:13px;flex-direction:column}

/* Raster und freie Felder */
.lt-raster line{stroke:var(--lt-raster);stroke-width:1.6}
.lt-raster path{fill:none}
.lt-raster-fein{stroke:var(--lt-raster-fein);stroke-width:1.2}
.lt-raster-kreuz{stroke:var(--lt-kreuz);stroke-width:1.8}
.lt-auge{fill:var(--lt-blatt);stroke:var(--lt-auge);stroke-width:4}
.lt-frei{animation:lt-blink 1.4s ease-in-out infinite}
.lt-frei circle{fill:var(--rg-gold);fill-opacity:.22;stroke:var(--rg-gold-text);stroke-width:4}
.lt-frei path{fill:none;stroke:var(--rg-gold-text);stroke-width:4;stroke-linecap:round}
/* Adern: dunkle Kontur, farbige Isolation, heller Kern */
.lt-ader path,.lt-geist{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lt-ader-rand{stroke:var(--lt-kontur);stroke-width:18.5}
.lt-leitung{stroke-width:12.5}
.lt-ader-kern{stroke:#fff;stroke-width:2.6;opacity:.7}
.lt-ader.aktiv .lt-ader-rand{stroke-width:22.5}
.lt-ader.aktiv .lt-ader-kern{opacity:1}
.lt-geist{stroke-width:7;stroke-dasharray:1 13}
/* offenes Ende: Aderendhülse in Zugrichtung */
.lt-ende-stift{fill:var(--lt-metall);stroke:var(--lt-kontur);stroke-width:2.5}
.lt-ende-kragen{stroke:var(--lt-kontur);stroke-width:2.5}
.lt-ende.aktiv .lt-ende-stift{fill:var(--rg-gold)}
/* Reihenklemme: Gehäuse in der Aderfarbe, Schraube, Schild mit Buchstabe.
   Verbunden: dunkler Rahmen und quer gedrehter Schraubenschlitz. Aktiv: goldener Rahmen mit dunkler Kontur (Hof). */
.lt-k-in{transform-box:fill-box;transform-origin:center}
.lt-k-hof{fill:none;stroke:var(--lt-kontur);stroke-width:10.5;opacity:0}
.lt-k-rahmen{fill:none;stroke:var(--lt-kontur);stroke-width:3;opacity:0}
.lt-k-koerper{stroke:var(--lt-kontur);stroke-width:3.5}
.lt-k-schraube{fill:var(--lt-kontur);fill-opacity:.82;stroke:#fff;stroke-opacity:.4;stroke-width:1.6}
.lt-k-schlitz{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;transform-box:fill-box;transform-origin:center;transform:rotate(-35deg);transition:transform .25s}
.lt-k-schild{fill:#fff;stroke:var(--lt-kontur);stroke-opacity:.5;stroke-width:1.5}
.lt-k-text{fill:var(--rg-text);font-size:36px;font-weight:800;text-anchor:middle}
.lt-k.verbunden .lt-k-rahmen{opacity:1}
.lt-k.verbunden .lt-k-schlitz{transform:rotate(90deg)}
.lt-k.neu .lt-k-in{animation:lt-puls .35s ease-out}
.lt-k.aktiv .lt-k-hof{opacity:1}
.lt-k.aktiv .lt-k-rahmen{opacity:1;stroke:var(--rg-gold);stroke-width:5.5}
.lt-zeiger,.lt-zeiger-hof{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lt-zeiger-hof{stroke:var(--lt-kontur);stroke-width:9.5}
.lt-zeiger{stroke:var(--rg-gold);stroke-width:5}
.lt-brett.geloest .lt-ader-kern{opacity:1}
.lt-brett.frisch .lt-ader-kern{animation:lt-strom .8s ease-out}
@keyframes lt-puls{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes lt-strom{0%{stroke-width:2.6;opacity:.7}40%{stroke-width:8;opacity:1}100%{stroke-width:2.6;opacity:1}}
@keyframes lt-blink{0%,100%{opacity:1}50%{opacity:.7}}   /* auch am tiefsten Punkt bleibt die Messmarke über 3:1 zum Blatt */

.lt-klemme{position:absolute;appearance:none;-webkit-appearance:none;margin:0;padding:0;border:0;border-radius:18%;background:transparent;color:transparent;cursor:pointer;touch-action:none}
.lt-klemme:focus-visible{outline:3px solid var(--rg-blau);outline-offset:-2px}
.lt-brett.geloest .lt-klemme{cursor:default}

.lt-hinweis{margin:0;min-height:1.45em;font-size:.88rem;text-align:center;color:var(--rg-leise);text-wrap:balance}
.lt-hinweis.warn{color:var(--rg-gold-text);font-weight:700}
.lt-hinweis.gut{color:var(--rg-gruen);font-weight:700}

/* Klemmenleiste unter dem Brett: je Leitung eine kleine Klemme; ist sie verbunden, wird sie getönt und trägt einen Haken */
.lt-leiste{display:flex;justify-content:center;max-width:100%;border:1px solid var(--rg-linie);border-radius:12px;background:var(--rg-flaeche);box-shadow:var(--rg-schatten-klein)}
.lt-leiste span{display:flex;align-items:center;justify-content:center;gap:3px;min-width:35px;padding:6px 5px;border-left:1px solid var(--rg-linie);font-size:.72rem;font-weight:800}
.lt-leiste span:first-child{border-left:0}
.lt-leiste i{flex:none;display:grid;place-items:center;width:20px;height:22px;border-radius:5px;border:2px solid var(--f);border-top-width:6px;background:var(--rg-flaeche);font-style:normal;line-height:1;color:var(--rg-text)}
.lt-leiste em{width:10px;font-style:normal;text-align:center;color:var(--rg-leise)}
.lt-leiste span.zu i{background:var(--rg-flaeche2);background:color-mix(in srgb,var(--f) 20%,#fff)}
.lt-leiste span.zu em{color:var(--rg-gruen)}

.lt-knoepfe{width:100%}
.lt-knoepfe .rg-knopf{flex:1 1 130px;max-width:230px;white-space:nowrap}
.lt-versteckt{display:none!important}
.lt-ansage{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;clip-path:inset(50%);white-space:nowrap}
.lt-bild{display:block;width:156px;height:156px;margin:0 auto;border-radius:12px;background:var(--lt-blatt);border:1px solid var(--rg-linie);box-shadow:var(--rg-schatten-klein)}
.lt-zeichen{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.16em}
@media(max-width:380px){.lt-hinweis{min-height:2.9em;display:flex;align-items:center;justify-content:center}
  .lt-knoepfe .rg-knopf{flex-basis:120px;padding:10px 12px;font-size:.88rem}}
@media(max-width:340px){.lt-wert{padding:6px 8px}.lt-wert span{font-size:.66rem}.lt-zeit{min-width:60px}
  .lt-leiste span{min-width:0;gap:2px;padding:6px 3px}.lt-leiste i{width:18px}.lt-leiste em{width:9px}}
@media(max-width:360px){.rg-zahlen b{font-size:1.15rem;white-space:nowrap}}
</style>
</head>
<body>
<main id="spiel">
  <noscript><p>Für dieses Rätsel braucht es JavaScript.</p></noscript>
  <div class="lt-werte">
    <div class="lt-wert" id="wert-leitungen"><b>–</b> <span>Leitungen verbunden</span></div>
    <div class="lt-wert" id="wert-felder"><b>–</b> <span>Felder belegt</span></div>
    <div class="lt-wert lt-zeit" id="wert-zeit"><b>0:00</b> <span>Zeit</span></div>
  </div>
  <div class="lt-brett" id="brett" role="group" aria-label="Spielbrett"></div>
  <p class="lt-hinweis" id="hinweis" role="status" aria-live="polite"></p>
  <div class="lt-leiste" id="leiste" aria-hidden="true"></div>
  <div class="rg-reihe lt-knoepfe">
    <button type="button" class="rg-knopf" id="knopf-zurueck"><span aria-hidden="true">↶</span> Schritt zurück</button>
    <button type="button" class="rg-knopf" id="knopf-leeren">Alles löschen</button>
    <button type="button" class="rg-knopf haupt lt-versteckt" id="knopf-ergebnis">Ergebnis anzeigen</button>
  </div>
  <div class="lt-ansage" id="ansage" aria-live="polite"></div>
</main>
<script src="kern.js"></script>
<script>
/* Leitungen – Tagesrätsel von RG Ing. Consulting. Eigenentwicklung: Erzeugung, Regeln, Gestaltung und Bedienung
   sind eigens für diese Seite geschrieben. Keine fremden Bibliotheken, keine externen Anfragen. */
(function () {
  'use strict';

  /* Kräftige Aderfarben für das helle Blatt, frei gewählt (keine Aussage über genormte Leiterfarben). Die Zuordnung trägt immer der Buchstabe.
     Jede Farbe hat mindestens 3:1 zum Blatt. Helligkeit und Blau-Gelb-Anteil sind so gestaffelt, dass sich alle acht
     auch bei Rot-Grün-Schwäche voneinander abheben (Rot dunkler als Grün, Pink dunkler als Hellblau). Das Violett ist ein
     dunkles Indigo: mit Rot-Grün-Schwäche erscheint es wie das Blau als Blauton, der Helligkeitsabstand hält die beiden auseinander. */
  var FARBEN = ['#d27c01', '#1a66d6', '#c8102e', '#27a16a', '#3c00e0', '#049cc8', '#bc0281', '#222d3d'];
  var BUCHSTABEN = 'ABCDEFGH';

  /* ---------- Zeichenhelfer (Brett und Beispielbild nutzen dieselben Bausteine) ---------- */
  // Reihenklemme um den Feldmittelpunkt: Rahmen mit Hof (nur verbunden/aktiv sichtbar), Gehäuse, Schraube mit Schlitz, Schild mit Buchstabe
  function klemmeSvg(farbe, buchstabe) {
    return '<rect class="lt-k-hof" x="-42" y="-42" width="84" height="84" rx="13"/><rect class="lt-k-rahmen" x="-42" y="-42" width="84" height="84" rx="13"/>' +
      '<rect class="lt-k-koerper" x="-36" y="-36" width="72" height="72" rx="9" fill="' + farbe + '"/>' +
      '<circle class="lt-k-schraube" cy="-23.5" r="8"/><path class="lt-k-schlitz" d="M-5.5 -23.5h11"/>' +
      '<rect class="lt-k-schild" x="-27" y="-12" width="54" height="41" rx="5"/>' +
      '<text class="lt-k-text" y="8.5" dy=".35em">' + buchstabe + '</text>';
  }
  // Ader: dunkle Kontur, farbige Isolation, heller Kern – drei Linien mit demselben Verlauf
  function aderSvg(farbe, buchstabe, d) {
    return '<g class="lt-ader"><path class="lt-ader-rand" d="' + d + '"/>' +
      '<path class="lt-leitung" stroke="' + farbe + '" data-buchstabe="' + buchstabe + '" data-laenge="0" d="' + d + '"/>' +
      '<path class="lt-ader-kern" d="' + d + '"/></g>';
  }
  function rasterSvg(k) {
    var B = k * 100, h = '<g class="lt-raster">', kreuze = '', fein = '', j, m;
    for (j = 20; j < B; j += 20) if (j % 100) fein += 'M' + j + ' 0V' + B + 'M0 ' + j + 'H' + B;   // feines Zwischenraster, fünf Teilungen je Feld
    h += '<path class="lt-raster-fein" d="' + fein + '"/>';
    for (j = 1; j < k; j++) h += '<line x1="' + j * 100 + '" y1="0" x2="' + j * 100 + '" y2="' + B + '"/><line x1="0" y1="' + j * 100 + '" x2="' + B + '" y2="' + j * 100 + '"/>';
    for (j = 1; j < k; j++) for (m = 1; m < k; m++) kreuze += 'M' + (j * 100 - 6) + ' ' + m * 100 + 'h12M' + j * 100 + ' ' + (m * 100 - 6) + 'v12';
    return h + '<path class="lt-raster-kreuz" d="' + kreuze + '"/></g>';
  }
  function beispielKlemme(x, y, nr) { return '<g class="lt-k verbunden" transform="translate(' + x + ' ' + y + ')">' + klemmeSvg(FARBEN[nr], BUCHSTABEN[nr]) + '</g>'; }

  var AUGE = '<svg class="lt-zeichen" viewBox="0 0 30 30" aria-hidden="true"><circle class="lt-auge" cx="15" cy="15" r="8"/></svg>';
  var REGELN =
    '<svg class="lt-bild" viewBox="0 0 300 300" role="img" aria-label="Beispiel als Klemmenplan: die Klemmen A und B sind je mit einer Leitung verbunden, jedes Feld ist belegt">' +
      rasterSvg(3) + aderSvg(FARBEN[0], 'A', 'M50 50L150 50L250 50L250 150') + aderSvg(FARBEN[1], 'B', 'M150 150L50 150L50 250L150 250L250 250') +
      beispielKlemme(50, 50, 0) + beispielKlemme(250, 150, 0) + beispielKlemme(150, 150, 1) + beispielKlemme(250, 250, 1) +
    '</svg>' +
    '<ul><li>Verbinde die zwei Klemmen mit demselben Buchstaben durch eine Leitung. Der Buchstabe steht auf dem Schild der Klemme, jede Leitung hat ihre eigene Aderfarbe.</li>' +
    '<li>Leitungen laufen waagrecht oder senkrecht von Feld zu Feld. Sie dürfen sich nicht kreuzen.</li>' +
    '<li>Am Ende muss jedes Feld belegt sein. Ein Lötauge ' + AUGE + ' zeigt dir, wo noch keine Ader durchläuft.</li></ul>' +
    '<p><b>Ziehen:</b> Starte bei einer Klemme oder am offenen Ende einer angefangenen Leitung. Fährst du über eine andere Leitung, wird sie dort gekappt. Ein Tipp auf eine Klemme löscht ihre Leitung.</p>' +
    '<p><b>Tastatur:</b> Mit Tab zu einer Klemme, Enter drücken und mit den Pfeiltasten ziehen. Entf löscht die Leitung.</p>' +
    '<p>Die Zeit läuft ab deinem ersten Zug. Gibt es mehr als eine Lösung, zählt jede gültige.</p>';

  var S = RG.rahmen({ id: 'leitungen', regelnHtml: REGELN, tageswechsel: true });   // neuer Tag: der Rahmen lädt das neue Rätsel
  var wochenende = S.heute.wochentag === 0 || S.heute.wochentag === 6;
  var n = wochenende ? 7 : 6, N = n * n;

  /* ---------- Raster-Helfer ---------- */
  function zeile(z) { return Math.floor(z / n); }
  function spalte(z) { return z % n; }
  function benachbart(a, b) { return Math.abs(zeile(a) - zeile(b)) + Math.abs(spalte(a) - spalte(b)) === 1; }
  function kopie(w) { return w.map(function (x) { return x.slice(); }); }
  function minSek(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }

  /* ---------- Aufgabe des Tages ----------
     Ein Weg durch alle Felder (Schlangenlinie, dann viele Umklapp-Schritte am Wegende), in Abschnitte geschnitten.
     Jeder Abschnitt ist eine Leitung, seine Enden sind die Klemmen. Damit ist die volle Belegung garantiert lösbar. */
  function wegDurchAlle(z) {
    var weg = [], r, c, i;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) weg.push(r * n + (r % 2 ? n - 1 - c : c));
    if (z() < 0.5) weg = weg.map(function (x) { return spalte(x) * n + zeile(x); });
    var richtungen = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (i = 0; i < N * 14; i++) {
      if (z() < 0.5) weg.reverse();
      var ende = weg[N - 1], d = richtungen[z.ganz(4)];
      var nr = zeile(ende) + d[0], nc = spalte(ende) + d[1];
      if (nr < 0 || nc < 0 || nr >= n || nc >= n) continue;
      var p = weg.indexOf(nr * n + nc);
      if (p === N - 2) continue;
      weg = weg.slice(0, p + 1).concat(weg.slice(p + 1).reverse());   // Ende an den Nachbarn klappen
    }
    return weg;
  }
  function richtungswechsel(w) { var k = 0; for (var i = 2; i < w.length; i++) if (w[i] - w[i - 1] !== w[i - 1] - w[i - 2]) k++; return k; }
  function schlaufen(w) { var k = 0; for (var i = 0; i < w.length; i++) for (var j = i + 3; j < w.length; j++) if (benachbart(w[i], w[j])) k++; return k; }
  function erzeuge(z, minAnzahl, maxAnzahl) {
    var beste = null, gueltige = 0;
    for (var versuch = 0; versuch < 800; versuch++) {
      var weg = wegDurchAlle(z), k = minAnzahl + z.ganz(maxAnzahl - minAnzahl + 1);
      var frei = N - 3 * k, schnitte = [], i;
      for (i = 0; i < k - 1; i++) schnitte.push(z.ganz(frei + 1));
      schnitte.sort(function (a, b) { return a - b; });
      var teile = [], von = 0;
      for (i = 0; i < k; i++) { var bis = i < k - 1 ? schnitte[i] + 3 * (i + 1) : N; teile.push(weg.slice(von, bis)); von = bis; }
      // Qualitätsregeln: keine Klemmen direkt nebeneinander, nicht alles gleich lang, mindestens eine verwinkelte Leitung
      var gut = true, gleichLang = true, kurven = 0, wert = 0;
      for (i = 0; i < k; i++) {
        var t = teile[i];
        if (benachbart(t[0], t[t.length - 1])) gut = false;
        if (t.length !== teile[0].length) gleichLang = false;
        kurven = Math.max(kurven, richtungswechsel(t));
        wert += schlaufen(t);
      }
      if (!gut || gleichLang || kurven < 3) { if (!beste && versuch === 799) beste = { teile: teile, wert: wert }; continue; }
      // Unter mehreren gültigen Kandidaten den mit den wenigsten eng gefalteten Leitungen nehmen
      if (!beste || wert < beste.wert) beste = { teile: teile, wert: wert };
      if (++gueltige >= 12 || beste.wert === 0) break;
    }
    return z.misch(beste.teile).map(function (t) { return z() < 0.5 ? t.slice().reverse() : t; });
  }

  var loesung = erzeuge(S.zufall, wochenende ? 6 : 5, wochenende ? 8 : 6);
  var K = loesung.length;
  var klemmeAn = [], klemmen = [], f, i;
  for (i = 0; i < N; i++) klemmeAn.push(-1);
  for (f = 0; f < K; f++) {
    klemmen.push([loesung[f][0], loesung[f][loesung[f].length - 1]]);
    klemmeAn[klemmen[f][0]] = f; klemmeAn[klemmen[f][1]] = f;
  }
  window.RG_TEST = {

        if (neu === kopf) RG.toast(komplett(k.f) ? 'Leitung ' + BUCHSTABEN[k.f] + ' ist verbunden' : 'Hier geht es nicht weiter', 1200);
        else if (!komplett(k.f)) sag('Zeile ' + (zeile(neu) + 1) + ', Spalte ' + (spalte(neu) + 1));
      }
    } else if (key === 'Escape') {
      if (tast) { ev.preventDefault(); tastEnde(); }
    } else if (key === 'Delete' || key === 'Backspace') {
      ev.preventDefault();
      tastEnde();
      loescheLeitung(k.f);
    }
  }

  /* ---------- Knöpfe ---------- */
  knopfZurueck.addEventListener('click', function () {
    if (gesperrt) return;
    zeigerAbbruch(); tastEnde(); if (zug) beende();
    if (!verlauf.length) return;
    wege = verlauf.pop();
    speichere(); zeichne();
  });
  knopfLeeren.addEventListener('click', function () {
    if (gesperrt) return;
    zeigerAbbruch(); tastEnde(); if (zug) beende();
    if (zaehle(wege).belegt === 0) return;
    verlauf.push(kopie(wege)); if (verlauf.length > 60) verlauf.shift();
    wege = leer();
    speichere(); zeichne();
  });
  knopfErgebnis.addEventListener('click', function () { S.zeigeErgebnis(); });

  /* ---------- Zeit ---------- */
  var letzteSicherung = 0;
  setInterval(function () {
    if (gesperrt || zeit.seit == null) return;
    zeichneZeit();
    if (Date.now() - letzteSicherung > 5000 && !zug) { letzteSicherung = Date.now(); speichere(); }
  }, 250);
  document.addEventListener('visibilitychange', function () {
    if (gesperrt) return;
    if (document.hidden) { zeitStopp(); if (begonnen && !zug) speichere(); } else zeitStart();
  });
  window.addEventListener('pagehide', function () { if (!gesperrt && begonnen) { if (zug) beende(); else speichere(); } });

  baue();
  zeichne();
  pruefe();      // ein vollständig gespeichertes Brett ohne Ergebnis wird gewertet statt hängen zu bleiben
  zeitStart();
})();
</script>
