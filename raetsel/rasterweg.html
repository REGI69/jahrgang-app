<style>
/* Rasterweg – eigene Gestaltung: helles Planblatt mit feinem Raster, der Weg als kräftiges blaues Band
   mit heller Mittellinie, Wegpunkte als runde Marken (frei = weiss, dran = Gold, besucht = dunkel gefüllt).
   Alle Farben aus kern.css. Nachgerechnete Paare (WCAG): Band Blau auf Weiss 5.4 und auf Hellblau 4.5, Band Grün auf Weiss 5.3
   und auf Hellgrün 4.6, Markenrand Nacht auf Weiss 16.3, Zahl auf Gold 8.1, Zahl Weiss auf Nacht 16.3, Rasterpunkte auf Weiss 6.1,
   Weiss auf Rot 5.5, Hinweis Grün auf Hellgrün 4.6, Hinweis Goldtext auf Hellgold 5.8. */
#spiel{gap:12px}
.rw-status{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 2px;font-size:.95rem;font-variant-numeric:tabular-nums}
.rw-status>span{white-space:nowrap}
#rw-fortschritt{font-weight:800}
#rw-naechste{display:inline-flex;align-items:center;gap:7px;color:var(--rg-leise);font-size:.84rem}
#rw-naechste b{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 5px;border-radius:14px;background:var(--rg-gold);border:2px solid var(--rg-nacht);color:var(--rg-text);font-size:.9rem;font-weight:800;line-height:1}
#rw-zeit{text-align:right;font-weight:800}
#rw-zeit i{font-style:normal;margin-right:3px}
.rw-balken{width:100%;height:6px;margin-top:-4px;border-radius:3px;background:var(--rg-linie);overflow:hidden}
.rw-balken i{display:block;height:100%;width:0;border-radius:3px;background:var(--rg-blau);transition:width .18s ease-out,background .35s}

.rw-brett{position:relative;width:min(100%,calc(100vh - 250px));width:min(100%,calc(100dvh - 250px));min-width:min(100%,calc(var(--n,6) * 40px));aspect-ratio:1/1;flex:none;
  border-radius:18px;overflow:hidden;background:var(--rg-flaeche);box-shadow:0 0 0 1px var(--rg-linie),0 2px 4px rgba(21,32,51,.05),0 14px 34px rgba(21,32,51,.13);transition:box-shadow .35s;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;container-type:inline-size}
.rw-brett svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.rw-gitter line{stroke:var(--rg-linie);stroke-width:1px;vector-effect:non-scaling-stroke}
.rw-gitter circle{fill:var(--rg-leise)}
.rw-belegt rect{fill:var(--rg-blau-hell);opacity:0;transition:opacity .16s,fill .35s}
.rw-belegt rect.an{opacity:1}
.rw-band{fill:none;stroke:var(--rg-blau);stroke-width:44;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
.rw-mitte{fill:none;stroke:var(--rg-blau-hell);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
.rw-glanz{fill:none;stroke:#fff;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.rw-kopf{fill:var(--rg-flaeche);stroke:var(--rg-nacht);stroke-width:5;transition:transform .09s ease-out}

.rw-felder{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr)}
.rw-feld{appearance:none;position:relative;display:grid;place-items:center;min-width:0;min-height:0;margin:0;padding:0;border:0;border-radius:0;background:transparent;color:inherit;
  cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.rw-feld:focus-visible{outline:3px solid var(--rg-nacht);outline-offset:-4px;border-radius:9px}
@media(hover:hover){.rw-brett:not(.gesperrt) .rw-feld:not(.nein):hover{box-shadow:inset 0 0 0 2px rgba(26,102,214,.38);border-radius:9px}}
.rw-brett.gesperrt .rw-feld{cursor:default}
/* Marken: frei = weiss mit dunklem Rand, dran = Gold mit kräftigerem Rand und Ring, besucht = dunkel gefüllt mit weisser Zahl, Ziel = Doppelring */
.rw-zahl{display:grid;place-items:center;width:66%;aspect-ratio:1/1;border-radius:50%;background:var(--rg-flaeche);border:2.5px solid var(--rg-nacht);color:var(--rg-text);
  font-weight:800;line-height:1;font-size:1.15rem;font-size:calc(34cqw / var(--n));font-variant-numeric:tabular-nums;pointer-events:none;
  box-shadow:var(--rg-schatten-klein);transition:background .15s,color .15s,border-color .15s,transform .15s}
.rw-feld.ziel .rw-zahl{box-shadow:0 0 0 2.5px var(--rg-flaeche),0 0 0 5px var(--rg-nacht)}
.rw-feld.dran .rw-zahl{background:var(--rg-gold);border-width:3.5px;box-shadow:0 0 0 4px rgba(245,166,35,.4);animation:rw-puls 1.6s ease-in-out infinite}
.rw-feld.dran.ziel .rw-zahl{box-shadow:0 0 0 2.5px var(--rg-flaeche),0 0 0 5px var(--rg-nacht),0 0 0 9px rgba(245,166,35,.4);animation-name:rw-puls-ziel}
.rw-feld.besucht .rw-zahl{background:var(--rg-nacht);color:#fff;box-shadow:0 0 0 2.5px #fff;transform:scale(1.04)}
.rw-feld.besucht.ziel .rw-zahl{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--rg-nacht),0 0 0 7.5px #fff}
/* Abgelehnter Zug: roter Rahmen und rote Marke mit ✕ */
.rw-feld.nein{animation:rw-ruck .34s;background:rgba(194,53,43,.14);box-shadow:inset 0 0 0 3px var(--rg-rot);border-radius:8px;z-index:1}
.rw-feld.nein::after{content:"✕";position:absolute;top:3px;right:3px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--rg-rot);color:#fff;
  font-size:.66rem;font-weight:800;line-height:1;box-shadow:0 0 0 1.5px #fff}
@keyframes rw-puls{0%,100%{box-shadow:0 0 0 4px rgba(245,166,35,.4),0 0 0 4px rgba(245,166,35,.5)}60%{box-shadow:0 0 0 4px rgba(245,166,35,.4),0 0 0 11px rgba(245,166,35,0)}}
@keyframes rw-puls-ziel{0%,100%{box-shadow:0 0 0 2.5px var(--rg-flaeche),0 0 0 5px var(--rg-nacht),0 0 0 9px rgba(245,166,35,.4),0 0 0 9px rgba(245,166,35,.5)}
  60%{box-shadow:0 0 0 2.5px var(--rg-flaeche),0 0 0 5px var(--rg-nacht),0 0 0 9px rgba(245,166,35,.4),0 0 0 15px rgba(245,166,35,0)}}
@keyframes rw-ruck{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Gelöst: Band, Felder, Rahmen und Balken in Grün */
.rw-brett.geloest{box-shadow:0 0 0 2px var(--rg-gruen),0 2px 4px rgba(21,32,51,.05),0 14px 34px rgba(8,122,102,.2)}
.rw-brett.geloest .rw-band{stroke:var(--rg-gruen)}
.rw-brett.geloest .rw-mitte{stroke:var(--rg-gruen-hell)}
.rw-brett.geloest .rw-belegt rect.an{fill:var(--rg-gruen-hell)}
.rw-brett.geloest .rw-gitter line{stroke:rgba(8,122,102,.22)}
.rw-brett.geloest .rw-kopf{opacity:0}
.rw-brett.feier .rw-glanz{animation:rw-glanz .85s ease-out both}
#spiel:has(.rw-brett.geloest) .rw-balken i{background:var(--rg-gruen)}
#spiel:has(.rw-brett.geloest) #rw-naechste{color:var(--rg-gruen);font-weight:800}
@keyframes rw-glanz{0%{opacity:.75;stroke-dashoffset:1}80%{opacity:.75}100%{opacity:0;stroke-dashoffset:0}}

.rw-hinweis{margin:0;min-height:2.7em;padding:4px 14px;border-radius:12px;display:grid;place-items:center;text-align:center;font-size:.88rem;color:var(--rg-leise);text-wrap:balance}
.rw-hinweis.gut{color:var(--rg-gruen);font-weight:700;background:var(--rg-gruen-hell)}
.rw-hinweis.achtung{color:var(--rg-gold-text);font-weight:700;background:var(--rg-gold-hell);box-shadow:inset 0 0 0 1px rgba(245,166,35,.6)}
.rw-knoepfe{width:100%;gap:10px}
.rw-knoepfe .rg-knopf{flex:1 1 130px;max-width:230px;white-space:nowrap;touch-action:manipulation}
.rw-knoepfe .rg-knopf[hidden]{display:none}
@media(max-width:350px){.rw-status{font-size:.84rem}#rw-naechste{font-size:.76rem;gap:5px}#rw-naechste b{min-width:26px;height:26px}.rw-knoepfe .rg-knopf{padding:10px 8px;font-size:.84rem}}
@media(max-height:620px){#spiel{gap:10px}.rw-hinweis{min-height:1.4em}}
/* Meldung so breit wie ihr Text (höchstens 90vw), Kennzahlen im Ergebnisfenster einzeilig */
.rg-toast{width:max-content}
.rg-zahlen b{white-space:nowrap}
@media(max-width:350px){.rg-zahlen b{font-size:1.2rem}}
</style>
</head>
<body>
<main id="spiel"></main>
<script src="kern.js"></script>
<script>
(function () {
  'use strict';

  var REGELN =
    '<ol><li>Zeichne <b>einen</b> Weg durch das Raster. Er beginnt bei der <b>1</b>.</li>' +
    '<li>Der Weg besucht <b>jedes Feld genau einmal</b> und geht immer zum Nachbarfeld, nie diagonal.</li>' +
    '<li>Die Zahlen kommen in <b>aufsteigender Reihenfolge</b>. Die höchste Zahl ist das Ziel und damit das letzte Feld.</li></ol>' +
    '<p><b>Bedienung:</b> Zieh mit dem Finger oder der Maus, tippe Felder nacheinander an oder nimm die Pfeiltasten. ' +
    'Fährst du über deinen Weg zurück, wird er kürzer. Ein Tipp auf ein Feld im Weg kürzt bis dorthin. Die Rücktaste nimmt einen Schritt zurück.</p>' +
    '<p>Von Montag bis Freitag ist das Raster 6×6 gross, am Wochenende 7×7. Die Zeit läuft ab deinem ersten Zug.</p>';

  var S = RG.rahmen({ id: 'rasterweg', regelnHtml: REGELN, tageswechsel: true });   // neuer Tag: der Rahmen lädt das neue Rätsel
  var wt = S.heute.wochentag;
  var N = (wt === 0 || wt === 6) ? 7 : 6;
  var TOTAL = N * N, E = 100;                 // E = Kantenlänge eines Felds in SVG-Einheiten
  var SVGNS = 'http://www.w3.org/2000/svg';
  var z = S.zufall;

  function zeile(i) { return Math.floor(i / N); }
  function spalte(i) { return i % N; }
  function nachbarn(i) {
    var r = zeile(i), c = spalte(i), n = [];
    if (r > 0) n.push(i - N);
    if (r < N - 1) n.push(i + N);
    if (c > 0) n.push(i - 1);
    if (c < N - 1) n.push(i + 1);
    return n;
  }
  function benachbart(a, b) { return Math.abs(zeile(a) - zeile(b)) + Math.abs(spalte(a) - spalte(b)) === 1; }

  /* ---------- Aufgabe des Tages: zufälliger Weg durch alle Felder, darauf die Wegpunkte ---------- */
  function erzeugeWeg() {
    var w = [], r, c, i;
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) w.push(r * N + (r % 2 ? N - 1 - c : c));   // Schlangenlinie
    for (i = 0; i < TOTAL * 40; i++) {                                                           // Umklapp-Schritte am Wegende
      if (z() < 0.5) w.reverse();
      var ende = w[TOTAL - 1], davor = w[TOTAL - 2];
      var ziel = z.wahl(nachbarn(ende).filter(function (x) { return x !== davor; }));
      var k = w.indexOf(ziel);
      w = w.slice(0, k + 1).concat(w.slice(k + 1).reverse());
    }
    return w;
  }
  function setzePunkte() {
    var anzahl = 6 + z.ganz(4), pos, versuch, i;
    for (versuch = 0; versuch < 30; versuch++) {
      var gew = [], summe = 0, lauf = 0;
      for (i = 0; i < anzahl - 1; i++) { var g = 0.3 + z() * z() * 2.4; gew.push(g); summe += g; }
      pos = [0];
      for (i = 0; i < anzahl - 2; i++) {
        lauf += gew[i];
        var p = Math.round(lauf / summe * (TOTAL - 1));
        p = Math.max(p, pos[i] + 2);
        p = Math.min(p, TOTAL - 1 - 2 * (anzahl - 2 - i));
        pos.push(p);
      }
      pos.push(TOTAL - 1);
      var min = TOTAL, max = 0;
      for (i = 1; i < pos.length; i++) { min = Math.min(min, pos[i] - pos[i - 1]); max = Math.max(max, pos[i] - pos[i - 1]); }
      if (max - min >= 2) break;                                                                 // ungleichmässige Abstände
    }
    return pos;
  }

  var LOESUNG = erzeugeWeg();
  var PUNKT_POS = setzePunkte();
  var PUNKTE = PUNKT_POS.map(function (p) { return LOESUNG[p]; });
  var K = PUNKTE.length;
  var START = PUNKTE[0];
  var zahlBei = {};
  PUNKTE.forEach(function (feld, i) { zahlBei[feld] = i + 1; });

  window.RG_TEST = {
    loesung: LOESUNG.map(function (i) { return [zeile(i), spalte(i)]; }),
    groesse: N,
    punkte: PUNKTE.map(function (i) { return [zeile(i), spalte(i)]; }),
    weg: function () { return weg.map(function (i) { return [zeile(i), spalte(i)]; }); },
    sekunden: function () { return Math.floor(ms / 1000); }
  };

  /* ---------- Zustand ---------- */
  var weg = [START];            // besuchte Felder in Reihenfolge
  var platz = [];               // platz[feld] = Stelle im Weg oder -1
  var ms = 0, gestartet = false, geloest = false, letzterTakt = 0, gespeicherteSek = -1;

  function ordne() { var i; for (i = 0; i < TOTAL; i++) platz[i] = -1; for (i = 0; i < weg.length; i++) platz[weg[i]] = i; }
  function naechsteZahl(liste) { var n = 1, i; for (i = 0; i < liste.length; i++) if (zahlBei[liste[i]]) n++; return n; }
  /** Grund, warum das Feld jetzt nicht ans Wegende passt, oder '' wenn der Zug gilt. */
  function einwand(feld, laenge, naechste) {
    var zahl = zahlBei[feld];
    if (!zahl) return '';
    if (zahl !== naechste) return 'Zuerst kommt die ' + naechste + '.';
    if (zahl === K && laenge + 1 < TOTAL) return 'Die ' + K + ' ist das Ziel. Besuche zuerst alle anderen Felder.';
    return '';
  }
  function gueltig(liste) {
    if (!Array.isArray(liste) || !liste.length || liste.length > TOTAL || liste[0] !== START) return false;
    var gesehen = {}, naechste = 2, i;
    gesehen[START] = 1;
    for (i = 1; i < liste.length; i++) {
      var f = liste[i];
      if (typeof f !== 'number' || f % 1 || f < 0 || f >= TOTAL || gesehen[f] || !benachbart(liste[i - 1], f)) return false;
      if (einwand(f, i, naechste)) return false;
      if (zahlBei[f]) naechste++;
      gesehen[f] = 1;
    }
    return true;
  }
  function fmt(millis) { var s = Math.floor(millis / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function zeitklasse(millis) { var s = Math.floor(millis / 1000); return s < 60 ? '<1 Min' : s < 120 ? '1–2 Min' : s < 300 ? '2–5 Min' : '>5 Min'; }
  /* Derselbe Speicher kann in einem zweiten Tab oder Fenster weitergeschrieben worden sein. Diese Seite merkt sich,
     was sie zuletzt gelesen oder geschrieben hat. Weicht der Speicher davon ab, schreibt die Zeitmessung nicht mehr
     darüber, und beim Zurückkehren lädt die Seite neu. So geht kein gelöstes Rätsel und keine Statistik verloren. */
  var SCHLUESSEL = 'rg-spiele-v1:' + S.id + (S.heute.test ? ':test' : ''), bekannt = null, laedtNeu = false;
  function speicherbild() { try { return JSON.stringify(RG.lies(SCHLUESSEL)); } catch (e) { return null; } }
  function merke() { bekannt = speicherbild(); }
  function fremd() { return speicherbild() !== bekannt; }
  function abgleichen() { if (!laedtNeu && fremd()) { laedtNeu = true; RG.neuLaden(); } }   // RG.neuLaden lädt nur einmal, auch wenn der Rahmen gleichzeitig den Tageswechsel meldet
  /** still = Sichern durch die Zeitmessung: nur, wenn niemand sonst geschrieben hat. Ein Zug schreibt immer. */
  function speichere(still) {
    if (laedtNeu || (still && fremd())) return;
    gespeicherteSek = Math.floor(ms / 1000);
    S.sichereStand({ weg: weg.slice(), ms: Math.round(ms), gestartet: gestartet });
    merke();
  }

  /* ---------- Aufbau ---------- */
  var main = document.getElementById('spiel');
  var status = RG.el('div', { class: 'rw-status' });
  status.innerHTML = '<span id="rw-fortschritt"></span><span id="rw-naechste"></span><span id="rw-zeit" role="timer" aria-label="Zeit"></span>';
  var balken = RG.el('div', { class: 'rw-balken', 'aria-hidden': 'true', html: '<i></i>' });
  var brett = RG.el('div', { class: 'rw-brett', id: 'rw-brett', role: 'group', 'aria-label': 'Raster ' + N + ' mal ' + N + '. Zieh den Weg von der 1 aus.' });
  brett.style.setProperty('--n', N);
  var hinweis = RG.el('p', { class: 'rw-hinweis', id: 'rw-hinweis', 'aria-live': 'polite' });
  var knoepfe = RG.el('div', { class: 'rg-reihe rw-knoepfe' });
  knoepfe.innerHTML =
    '<button type="button" class="rg-knopf" id="rw-zurueck"><span aria-hidden="true">↶</span> Schritt zurück</button>' +
    '<button type="button" class="rg-knopf" id="rw-neu"><span aria-hidden="true">⟲</span> Neu beginnen</button>' +
    '<button type="button" class="rg-knopf haupt" id="rw-ergebnis" hidden>Ergebnis anzeigen</button>';
  main.appendChild(status); main.appendChild(balken); main.appendChild(brett); main.appendChild(hinweis); main.appendChild(knoepfe);

  function svgEl(tag, attrs, eltern) { var e = document.createElementNS(SVGNS, tag), k; for (k in attrs) e.setAttribute(k, attrs[k]); if (eltern) eltern.appendChild(e); return e; }
  var svg = svgEl('svg', { viewBox: '0 0 ' + N * E + ' ' + N * E, 'aria-hidden': 'true', focusable: 'false' }, brett);
  var gBelegt = svgEl('g', { class: 'rw-belegt' }, svg), belegt = [];
  var gGitter = svgEl('g', { class: 'rw-gitter' }, svg);
  (function () {
    var i, j;
    for (i = 0; i < TOTAL; i++) belegt.push(svgEl('rect', { x: spalte(i) * E, y: zeile(i) * E, width: E, height: E }, gBelegt));
    for (i = 1; i < N; i++) {
      svgEl('line', { x1: i * E, y1: 0, x2: i * E, y2: N * E }, gGitter);
      svgEl('line', { x1: 0, y1: i * E, x2: N * E, y2: i * E }, gGitter);
    }
    for (i = 1; i < N; i++) for (j = 1; j < N; j++) svgEl('circle', { cx: i * E, cy: j * E, r: 4 }, gGitter);
  })();
  var band = svgEl('polyline', { class: 'rw-band' }, svg);
  var mitte = svgEl('polyline', { class: 'rw-mitte' }, svg);
  var glanz = svgEl('polyline', { class: 'rw-glanz', pathLength: 1, 'stroke-dasharray': 1 }, svg);
  var kopf = svgEl('circle', { class: 'rw-kopf', cx: 0, cy: 0, r: 13 }, svg);

  var felderEl = RG.el('div', { class: 'rw-felder' }), felder = [];
  (function () {
    for (var i = 0; i < TOTAL; i++) {
      var b = RG.el('button', { type: 'button', class: 'rw-feld' + (zahlBei[i] === K ? ' ziel' : ''), 'data-feld': i, 'data-z': zeile(i), 'data-s': spalte(i), tabindex: '-1' });
      if (zahlBei[i]) b.appendChild(RG.el('span', { class: 'rw-zahl', 'aria-hidden': 'true' }, String(zahlBei[i])));
      felder.push(b); felderEl.appendChild(b);
    }
  })();
  brett.appendChild(felderEl);
  var elFort = document.getElementById('rw-fortschritt'), elNaechste = document.getElementById('rw-naechste'), elZeit = document.getElementById('rw-zeit');
  var knZurueck = document.getElementById('rw-zurueck'), knNeu = document.getElementById('rw-neu'), knErgebnis = document.getElementById('rw-ergebnis');

  /* ---------- Anzeige ---------- */
  function mittex(i) { return spalte(i) * E + E / 2; }
  function mittey(i) { return zeile(i) * E + E / 2; }
  function zeigeZeit() { elZeit.innerHTML = '<i aria-hidden="true">⏱</i>' + fmt(ms); }
  function sackgasse() {
    if (geloest || weg.length === TOTAL) return false;
    var ende = weg[weg.length - 1], naechste = naechsteZahl(weg);
    return !nachbarn(ende).some(function (f) { return platz[f] < 0 && !einwand(f, weg.length, naechste); });
  }
  function zeichne() {
    var i, punkte = '', naechste = naechsteZahl(weg), ende = weg[weg.length - 1];
    for (i = 0; i < weg.length; i++) punkte += mittex(weg[i]) + ',' + mittey(weg[i]) + ' ';
    if (weg.length === 1) punkte += punkte;                  // einzelner Punkt: als kurze Linie zeichnen
    band.setAttribute('points', punkte); mitte.setAttribute('points', punkte); glanz.setAttribute('points', punkte);
    kopf.style.transform = 'translate(' + mittex(ende) + 'px,' + mittey(ende) + 'px)';
    for (i = 0; i < TOTAL; i++) {
      var drin = platz[i] >= 0, zahl = zahlBei[i], b = felder[i];
      belegt[i].setAttribute('class', drin ? 'an' : '');
      b.classList.toggle('besucht', drin && !!zahl);
      b.classList.toggle('dran', !geloest && !!zahl && zahl === naechste);
      b.tabIndex = (i === ende) ? 0 : -1;
      b.setAttribute('aria-label', 'Zeile ' + (zeile(i) + 1) + ', Spalte ' + (spalte(i) + 1) +
        (zahl ? ', Zahl ' + zahl + (zahl === K ? ' (Ziel)' : '') : '') +
        (drin ? ', im Weg, Schritt ' + (platz[i] + 1) + (i === ende ? ', Wegende' : '') : ', frei'));
    }
    elFort.textContent = weg.length + ' / ' + TOTAL + ' Felder' + (geloest ? ' ✓' : '');
    balken.firstChild.style.width = (100 * weg.length / TOTAL) + '%';
    elNaechste.innerHTML = geloest ? 'Gelöst' : 'Nächste Zahl <b>' + Math.min(naechste, K) + '</b>';
    zeigeZeit();
    brett.classList.toggle('geloest', geloest);
    brett.classList.toggle('gesperrt', geloest);
    knZurueck.hidden = knNeu.hidden = geloest;
    knErgebnis.hidden = !geloest;
    knZurueck.disabled = knNeu.disabled = weg.length < 2;
    var text, art = '';
    if (geloest) { text = 'Gelöst in ' + fmt(ms) + '. Morgen wartet ein neuer Weg.'; art = 'gut'; }
    else if (weg.length === 1) text = 'Zieh von der 1 aus durch alle Felder oder tippe Feld um Feld an.';
    else if (sackgasse()) { text = 'Sackgasse: Von hier geht es nicht weiter. Nimm ein paar Schritte zurück.'; art = 'achtung'; }
    else if (naechste === K) text = 'Jetzt alle übrigen Felder. Die ' + K + ' ist das Ziel.';
    else text = 'Weiter zur ' + naechste + '. Jedes Feld genau einmal.';
    if (hinweis.textContent !== text) hinweis.textContent = text;
    hinweis.className = 'rw-hinweis' + (art ? ' ' + art : '');
  }
  var neinZeit = {};
  function ablehnen(feld, text) {
    var b = felder[feld];
    b.classList.remove('nein'); void b.offsetWidth; b.classList.add('nein');
    clearTimeout(neinZeit[feld]);
    neinZeit[feld] = setTimeout(function () { b.classList.remove('nein'); }, 520);
    if (text) RG.toast(text, 1700);
  }

  /* ---------- Züge ---------- */
  function nachZug(verlaengert) {
    if (verlaengert && !gestartet) { gestartet = true; letzterTakt = Date.now(); }
    if (laedtNeu) return;                     // die Seite lädt gerade den Stand aus einem anderen Tab
    if (weg.length === TOTAL) { gewonnen(); return; }
    speichere(); zeichne();
  }
  function setze(feld) { platz[feld] = weg.length; weg.push(feld); }
  function nimm() { platz[weg.pop()] = -1; }
  function kuerze(laenge) { var a = false; while (weg.length > Math.max(1, laenge)) { nimm(); a = true; } if (a) nachZug(false); return a; }

  /** Antippen: Feld im Weg kürzt bis dorthin; sonst gerade weiter bis zum Feld (alle Schritte müssen gelten). */
  function tippe(feld) {
    if (geloest) return false;
    var ende = weg[weg.length - 1];
    if (feld === ende) return true;
    if (platz[feld] >= 0) { kuerze(platz[feld] + 1); return true; }
    var dr = zeile(feld) - zeile(ende), dc = spalte(feld) - spalte(ende);
    if (dr && dc) { ablehnen(feld, 'Der Weg geht nur gerade weiter, nie diagonal.'); return false; }
    var schritt = dr ? (dr > 0 ? N : -N) : (dc > 0 ? 1 : -1), f = ende, liste = [], naechste = naechsteZahl(weg), grund;
    while (f !== feld) {
      f += schritt;
      if (platz[f] >= 0) { ablehnen(feld, 'Dazwischen liegt schon dein Weg.'); return false; }
      grund = einwand(f, weg.length + liste.length, naechste);
      if (grund) { ablehnen(f, grund); return false; }
      if (zahlBei[f]) naechste++;
      liste.push(f);
    }
    liste.forEach(setze);
    nachZug(true);
    return true;
  }
  /** Ein Schritt zum Nachbarfeld (Ziehen und Pfeiltasten). 1 = verlängert, -1 = gekürzt, 0 = nichts. */
  function schritt(feld, melden) {
    if (geloest) return 0;
    if (weg.length > 1 && feld === weg[weg.length - 2]) { nimm(); nachZug(false); return -1; }
    if (platz[feld] >= 0) { if (melden) ablehnen(feld, 'Dieses Feld liegt schon im Weg.'); return 0; }
    var grund = einwand(feld, weg.length, naechsteZahl(weg));
    if (grund) { if (melden) ablehnen(feld, grund); return 0; }
    setze(feld); nachZug(true);
    return 1;
  }
  function schrittZurueck() { if (!geloest && weg.length > 1) { nimm(); nachZug(false); } }
  function neuBeginnen() { if (!geloest) kuerze(1); }

  function gewonnen() {
    geloest = true; zieht = null;
    speichere(); zeichne();
    brett.classList.add('feier');
    var zeit = fmt(ms), form = N + '×' + N + ' · ' + K + ' Wegpunkte';
    S.fertig({
      gewonnen: true, wert: zeitklasse(ms),
      teilenText: S.info.titel + ' Nr. ' + S.heute.nr + ' ⏱ ' + zeit + '\n' + form,
      detailHtml: '<p>Zeit <b>' + zeit + '</b> · ' + form + '</p>'
    });
    merke();
  }

  /* ---------- Zeiger: Antippen und Ziehen ---------- */
  var zieht = null, letztesNein = -1, zeigerDruck = false;
  function feldBei(x, y, nurMitte) {
    var r = brett.getBoundingClientRect(), fx = (x - r.left) / r.width * N, fy = (y - r.top) / r.height * N;
    if (fx < 0 || fy < 0 || fx >= N || fy >= N) return null;
    var c = Math.floor(fx), ze = Math.floor(fy);
    if (nurMitte && (Math.abs(fx - c - 0.5) > 0.41 || Math.abs(fy - ze - 0.5) > 0.41)) return null;   // Rand eines Felds zählt beim Ziehen nicht
    return { feld: ze * N + c, fx: fx, fy: fy };
  }
  brett.addEventListener('pointerdown', function (ev) {
    if (geloest || !ev.isPrimary || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    zeigerDruck = true; zieht = null;
    var t = feldBei(ev.clientX, ev.clientY, false);
    if (!t) return;
    ev.preventDefault();
    letztesNein = -1;
    if (tippe(t.feld) && !geloest) {
      zieht = ev.pointerId;
      try { brett.setPointerCapture(ev.pointerId); } catch (e) {}
    }
  });
  brett.addEventListener('pointermove', function (ev) {
    if (zieht !== ev.pointerId || geloest) return;
    var t = feldBei(ev.clientX, ev.clientY, true), sicher = 0;
    if (!t) return;
    if (t.feld !== letztesNein) letztesNein = -1;
    while (!geloest && weg[weg.length - 1] !== t.feld && sicher++ < 2 * N) {
      // Schräg über eine Ecke zurück auf das eigene Wegstück: zwei Schritte kürzen statt daneben verlängern.
      if (weg.length > 2 && t.feld === weg[weg.length - 3]) { kuerze(weg.length - 2); break; }
      var ende = weg[weg.length - 1];
      var dx = t.fx - (spalte(ende) + 0.5), dy = t.fy - (zeile(ende) + 0.5);
      var waag = dx > 0.5 ? ende + 1 : dx < -0.5 ? ende - 1 : -1, senk = dy > 0.5 ? ende + N : dy < -0.5 ? ende - N : -1;
      var folge = Math.abs(dx) >= Math.abs(dy) ? [waag, senk] : [senk, waag], ging = false, i;
      for (i = 0; i < 2 && !ging; i++) {
        if (folge[i] < 0) continue;
        var direkt = folge[i] === t.feld && letztesNein !== t.feld;
        if (schritt(folge[i], direkt)) ging = true;
        else if (direkt) letztesNein = t.feld;
      }
      if (!ging) break;
    }
  });
  function loslassen(ev) {
    if (zieht !== ev.pointerId) return;
    zieht = null;
    try { brett.releasePointerCapture(ev.pointerId); } catch (e) {}
  }
  brett.addEventListener('pointerup', loslassen);
  brett.addEventListener('pointercancel', loslassen);
  brett.addEventListener('lostpointercapture', loslassen);
  brett.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  // Eingabetaste/Leertaste auf einem Feld oder Klick einer Bedienhilfe: wie Antippen. Der Klick nach einem Zeigerdruck
  // ist oben schon verarbeitet und zählt nicht noch einmal, auch nicht nach langem Druck.
  brett.addEventListener('click', function (ev) {
    var schonVerarbeitet = zeigerDruck && ev.detail !== 0;
    zeigerDruck = false;
    if (schonVerarbeitet) return;
    var b = ev.target.closest ? ev.target.closest('.rw-feld') : null;
    if (b) { tippe(+b.getAttribute('data-feld')); fokusAufEnde(); }
  });
  function fokusAufEnde() { if (brett.contains(document.activeElement)) felder[weg[weg.length - 1]].focus(); }

  /* ---------- Tastatur ---------- */
  var RICHTUNG = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  document.addEventListener('keydown', function (ev) {
    if (geloest || ev.altKey || ev.ctrlKey || ev.metaKey || document.querySelector('dialog[open]')) return;
    if (ev.key === 'Backspace') { ev.preventDefault(); schrittZurueck(); fokusAufEnde(); return; }
    var d = RICHTUNG[ev.key];
    if (!d) return;
    ev.preventDefault();
    var ende = weg[weg.length - 1], r = zeile(ende) + d[0], c = spalte(ende) + d[1];
    if (r < 0 || c < 0 || r >= N || c >= N) return;
    schritt(r * N + c, true);
    fokusAufEnde();
  });
  knZurueck.addEventListener('click', schrittZurueck);
  knNeu.addEventListener('click', neuBeginnen);
  knErgebnis.addEventListener('click', function () { S.zeigeErgebnis(); });

  /* ---------- Zeit: läuft ab dem ersten Zug, nur solange die Seite sichtbar ist ---------- */
  function takt() {
    var jetzt = Date.now();
    if (gestartet && !geloest && !document.hidden) {
      ms += Math.min(Math.max(jetzt - letzterTakt, 0), 1500);
      if (Math.floor(ms / 1000) !== gespeicherteSek) { speichere(true); gespeicherteSek = Math.floor(ms / 1000); zeigeZeit(); }
    }
    letzterTakt = jetzt;
  }
  setInterval(takt, 250);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (gestartet && !geloest) speichere(true); } else { letzterTakt = Date.now(); abgleichen(); } });
  window.addEventListener('pagehide', function () { if (gestartet && !geloest) speichere(true); });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted) { letzterTakt = Date.now(); abgleichen(); } });
  window.addEventListener('focus', abgleichen);

  /* ---------- Start: Zwischenstand oder gelöstes Brett laden ---------- */
  (function () {
    var st = S.ladeStand(), erg = S.ergebnis();
    merke();
    if (st && gueltig(st.weg)) { weg = st.weg.slice(); ms = +st.ms > 0 ? +st.ms : 0; gestartet = !!st.gestartet || weg.length > 1 || ms > 0; }
    if (erg) { geloest = true; if (weg.length !== TOTAL) weg = LOESUNG.slice(); }
    ordne();
    letzterTakt = Date.now();
    if (!erg && weg.length === TOTAL) gewonnen(); else zeichne();
  })();
})();
</script>
</body>
</html>
