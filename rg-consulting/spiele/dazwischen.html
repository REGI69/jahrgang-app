<style>
/* Dazwischen – eigene Gestaltung, helles Erscheinungsbild. Grössen hängen an --dz-g (Grenzfeld) und --dz-e (Eingabefeld).
   Eigene Farben, die im Kern fehlen (auf :root, weil das Regelfenster ausserhalb von #spiel liegt):
   --dz-gold-kante  dunkler Goldton für Rahmen und Marken, mindestens 3:1 zu Weiss, Goldhell und zur Leiste
   --dz-gold-licht  helles Gold für den Strich auf Blau, mindestens 3:1 zu --rg-blau
   --dz-rand        Kante der Tasten (unten) und Rahmen der blassen Tasten, mindestens 3:1 zum Seitengrund
   --dz-streif      zweiter Ton der schraffierten Leiste (ausgeschlossener Bereich) */
:root{--dz-gold-kante:#b36b00;--dz-gold-licht:#ffcf70;--dz-rand:#74829a;--dz-streif:#dbe3f0}
#spiel{--dz-g:clamp(34px,10.4vw,42px);--dz-e:clamp(46px,14vw,58px);--dz-th:52px;gap:14px}
#spiel>*{width:100%}
.dz-nur-vorlesen{position:absolute;width:1px!important;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Zeile mit Versuchszähler und Lückengrösse */
.dz-kopf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.86rem;color:var(--rg-leise);font-variant-numeric:tabular-nums;white-space:nowrap}
.dz-kopf b{color:var(--rg-text);font-size:1.05rem}
.dz-luecke{display:inline-flex;align-items:baseline;gap:.4em;padding:3px 12px;border-radius:999px;background:var(--rg-gold-hell);border:1.5px solid var(--dz-gold-kante);color:var(--rg-gold-text);font-weight:700}
.dz-kopf .dz-luecke b{font-size:1rem}

/* Leiste A–Z: das goldene Band ist die Lücke, in der das Wort liegt; schraffiert ist, was ausgeschlossen ist */
.dz-leiste{display:grid;gap:6px}
.dz-bahn{position:relative;height:18px;border-radius:9px;background:
  repeating-linear-gradient(135deg,var(--rg-flaeche2) 0 5px,var(--dz-streif) 5px 10px);box-shadow:inset 0 0 0 1px var(--rg-linie);overflow:hidden}
.dz-band{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--rg-gold);border:2px solid var(--dz-gold-kante);border-radius:9px;
  transition:left .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1)}
.dz-abc{display:grid;grid-template-columns:repeat(26,1fr);font-size:clamp(.58rem,2.6vw,.7rem);line-height:1;text-align:center;color:var(--rg-leise);font-weight:600}
.dz-abc span{padding:4px 0}
.dz-abc span.drin{color:var(--rg-text);font-weight:800;background:var(--rg-gold-hell);box-shadow:inset 0 -2px 0 var(--dz-gold-kante)}
.dz-abc span.drin:first-child,.dz-abc span:not(.drin)+span.drin{border-radius:6px 0 0 6px}
.dz-abc span.drin:last-child,.dz-abc span.drin:has(+span:not(.drin)){border-radius:0 6px 6px 0}
.dz-abc span:not(.drin)+span.drin:has(+span:not(.drin)),.dz-abc span.drin:first-child:has(+span:not(.drin)),.dz-abc span:not(.drin)+span.drin:last-child{border-radius:6px}

/* Zone: obere Grenze, Eingabe, untere Grenze – eine weisse Karte, die Lücke darin ist golden hinterlegt */
.dz-zone{display:grid;border:1px solid var(--rg-linie);border-radius:18px;background:var(--rg-flaeche);overflow:hidden;box-shadow:var(--rg-schatten)}
.dz-grenze{display:grid;justify-items:center;gap:8px;padding:14px 10px}
.dz-marke{margin:0;font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--rg-leise)}
.dz-wort{display:flex;gap:5px;justify-content:center;align-items:center;min-height:var(--dz-g)}
.dz-z{width:var(--dz-g);height:var(--dz-g);display:grid;place-items:center;position:relative;border-radius:10px;border:1px solid var(--rg-linie);background:var(--rg-flaeche2);color:var(--rg-text);
  font-size:calc(var(--dz-g)*.5);font-weight:800;line-height:1;text-transform:uppercase}
.dz-z.fest{background:var(--rg-blau);border-color:var(--rg-blau-dunkel);color:#fff;box-shadow:0 2px 6px rgba(26,102,214,.3)}
.dz-z.fest::after{content:"";position:absolute;left:22%;right:22%;bottom:4px;height:3px;border-radius:2px;background:var(--dz-gold-licht)}
.dz-offen{font-size:calc(var(--dz-g)*.56);font-weight:800;letter-spacing:.14em;color:var(--rg-leise);line-height:var(--dz-g)}
.dz-offen b{color:var(--rg-text)}
.dz-grenze.neu-oben .dz-wort{animation:dz-hoch .45s cubic-bezier(.2,.8,.2,1)}
.dz-grenze.neu-unten .dz-wort{animation:dz-runter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes dz-hoch{from{transform:translateY(46px) scale(1.12);opacity:.2}to{transform:none;opacity:1}}
@keyframes dz-runter{from{transform:translateY(-46px) scale(1.12);opacity:.2}to{transform:none;opacity:1}}

.dz-mitte{display:grid;justify-items:center;gap:9px;padding:14px 10px 13px;background:var(--rg-gold-hell);border-top:2px dashed var(--dz-gold-kante);border-bottom:2px dashed var(--dz-gold-kante)}
.dz-hier{margin:0;display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--rg-gold-text)}
.dz-hier::before,.dz-hier::after{content:"";width:22px;height:2px;border-radius:1px;background:var(--dz-gold-kante)}
.dz-eingabe{display:flex;gap:7px;justify-content:center}
.dz-e{width:var(--dz-e);height:var(--dz-e);display:grid;place-items:center;position:relative;border-radius:13px;border:2px solid var(--dz-gold-kante);background:var(--rg-flaeche);
  font-size:calc(var(--dz-e)*.5);font-weight:800;line-height:1;text-transform:uppercase;color:var(--rg-text);box-shadow:var(--rg-schatten-klein)}
.dz-e.voll{border-color:var(--rg-text);animation:dz-tipp .12s ease-out}
.dz-e.geist{color:var(--rg-blau)}
.dz-e.jetzt{box-shadow:0 0 0 4px rgba(245,166,35,.45),var(--rg-schatten-klein)}
.dz-e.jetzt::before{content:"";position:absolute;left:24%;right:24%;bottom:7px;height:3px;border-radius:2px;background:var(--dz-gold-kante);animation:dz-blink 1.1s steps(2,start) infinite}
.dz-e.treffer{background:var(--rg-blau);border-color:var(--rg-blau-dunkel);color:#fff;box-shadow:0 4px 12px rgba(26,102,214,.32)}
.dz-e.verpasst{background:var(--rg-gold);border-color:var(--dz-gold-kante);color:var(--rg-text)}
.dz-eingabe.wackel{animation:dz-wackel .36s}
.dz-eingabe.jubel .dz-e{animation:dz-jubel .5s cubic-bezier(.2,.8,.2,1) backwards}
.dz-eingabe.jubel .dz-e:nth-child(2){animation-delay:.07s}.dz-eingabe.jubel .dz-e:nth-child(3){animation-delay:.14s}
.dz-eingabe.jubel .dz-e:nth-child(4){animation-delay:.21s}.dz-eingabe.jubel .dz-e:nth-child(5){animation-delay:.28s}
@keyframes dz-tipp{from{transform:scale(.9)}to{transform:none}}
@keyframes dz-blink{to{visibility:hidden}}
@keyframes dz-wackel{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes dz-jubel{0%{transform:translateY(0)}45%{transform:translateY(-12px)}100%{transform:translateY(0)}}
.dz-tipp{margin:0;max-width:100%;min-height:1.3em;line-height:1.3;font-size:clamp(.74rem,3.9vw,.84rem);color:var(--rg-leise);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz-tipp b{color:var(--rg-text);letter-spacing:.04em}
.dz-tipp:empty{display:none}

/* Bildschirmtastatur: weisse Tasten auf dem hellen Seitengrund */
/* Die Zwischenräume gehören zur Tippfläche: der Knopf ist ein lückenloses Rechteck, sichtbar ist nur die Innenfläche (::before). */
.dz-tasten{--dz-tx:2px;--dz-ty:3px;width:calc(100% + 16px + 2*var(--dz-tx))!important;margin:calc(-1*var(--dz-ty)) calc(-8px - var(--dz-tx));display:grid;gap:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.dz-reihe{display:flex;gap:0}
.dz-taste{position:relative;z-index:0;flex:1 1 0;min-width:0;height:calc(var(--dz-th) + 2*var(--dz-ty));padding:0;border:0;border-radius:0;background:transparent;color:var(--rg-text);
  font-size:1.08rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dz-taste::before{content:"";position:absolute;z-index:-1;top:var(--dz-ty);bottom:var(--dz-ty);left:var(--dz-tx);right:var(--dz-tx);border-radius:9px;background:var(--rg-flaeche);
  box-shadow:inset 0 0 0 1px var(--rg-linie),0 2px 0 var(--dz-rand),0 3px 6px rgba(21,32,51,.10);transition:background .1s}
@media (hover:hover){
  .dz-taste:hover::before{background:var(--rg-blau-hell)}
  .dz-taste.los:hover::before{background:var(--rg-blau-dunkel)}
}
.dz-taste:active::before{background:var(--rg-blau-hell);transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--rg-blau)}
.dz-taste:focus-visible{outline:none}
.dz-taste:focus-visible::before{outline:3px solid var(--rg-blau);outline-offset:1px}
.dz-taste.breit{flex:1.95 1 0;font-size:clamp(.62rem,3vw,.8rem);letter-spacing:.01em}
.dz-taste.los{color:#fff}
.dz-taste.los::before{background:var(--rg-blau);box-shadow:0 2px 0 var(--rg-blau-dunkel),0 3px 8px rgba(26,102,214,.3)}
.dz-taste.los:active::before{background:var(--rg-blau-dunkel);box-shadow:none}
.dz-taste.los:focus-visible::before{outline-color:var(--rg-text)}
.dz-taste.fern{color:var(--rg-leise);font-weight:600}
.dz-taste.fern::before{background:transparent;box-shadow:none;border:1.5px dashed var(--dz-rand)}
/* Auch blasse Tasten antworten auf Maus und Finger; der gestrichelte Rahmen bleibt */
@media (hover:hover){
  .dz-taste.fern:hover::before{background:var(--rg-blau-hell)}
}
.dz-taste.fern:active::before{background:var(--rg-blau-hell);border-color:var(--rg-blau)}

/* Schluss */
.dz-schluss{display:grid;justify-items:center;gap:10px;padding:18px 16px;border:1px solid var(--rg-linie);border-radius:var(--rg-radius);background:var(--rg-flaeche);text-align:center;box-shadow:var(--rg-schatten)}
.dz-schluss p{margin:0}
.dz-schluss .gross{font-size:1.1rem;font-weight:800}
.dz-schluss .klein{font-size:.86rem;color:var(--rg-leise)}
[hidden]{display:none!important}

/* Versuchsliste */
.dz-liste{display:grid;gap:10px;margin-top:6px}
.dz-liste h2{margin:0;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rg-gold-text);font-weight:800}
.dz-liste p{margin:0;font-size:.84rem;color:var(--rg-leise)}
.dz-versuche{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.dz-versuche li{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:13px;background:var(--rg-flaeche);border:1px solid var(--rg-linie);box-shadow:var(--rg-schatten-klein)}
.dz-versuche .nr{font-size:.8rem;color:var(--rg-leise);font-variant-numeric:tabular-nums}
.dz-versuche .w{font-weight:800;letter-spacing:.16em;font-size:1rem}
/* Richtung: Pfeil in einer Marke plus Wort; die Farbe kommt nur dazu */
.dz-versuche .pf{display:inline-flex;align-items:center;gap:.5em;min-width:7.2em;padding:3px 12px 3px 4px;border-radius:999px;font-size:.82rem;font-weight:700;border:1.5px solid var(--rg-linie)}
.dz-versuche .pf i{display:grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;font-style:normal;font-size:.95rem;font-weight:800;line-height:1}
.dz-versuche li[data-richtung="frueher"] .pf{background:var(--rg-blau-hell);border-color:var(--rg-blau);color:var(--rg-blau-dunkel)}
.dz-versuche li[data-richtung="frueher"] .pf i{background:var(--rg-blau);color:#fff}
.dz-versuche li[data-richtung="spaeter"] .pf{background:var(--rg-gold-hell);border-color:var(--dz-gold-kante);color:var(--rg-gold-text)}
.dz-versuche li[data-richtung="spaeter"] .pf i{background:var(--rg-gold);color:var(--rg-text)}
.dz-versuche li[data-richtung="treffer"]{border-color:var(--rg-blau);background:var(--rg-blau-hell)}
.dz-versuche li[data-richtung="treffer"] .pf{background:var(--rg-blau);border-color:var(--rg-blau);color:#fff}
.dz-versuche li.frisch{animation:dz-frisch .4s ease-out}
@keyframes dz-frisch{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Beispiel in den Regeln */
.dz-bsp{display:grid;justify-items:center;gap:7px;padding:12px 10px;border-radius:14px;background:var(--rg-bg);border:1px solid var(--rg-linie);--dz-g:32px}
.dz-bsp .dz-wort{min-height:0}
.dz-bsp .dz-z:not(.fest){background:var(--rg-flaeche)}
.dz-bsp small{padding:2px 12px;border-radius:999px;background:var(--rg-gold-hell);border:1.5px dashed var(--dz-gold-kante);font-size:.72rem;color:var(--rg-gold-text);font-weight:800;letter-spacing:.08em;text-transform:uppercase}

@media (max-height:700px){
  #spiel{--dz-th:46px;gap:9px;padding-top:6px}
  .dz-grenze{padding:8px 10px;gap:5px}
  .dz-mitte{padding:8px 10px 8px;gap:6px}
  .dz-abc span{padding:3px 0}
  .dz-bahn{height:16px}
  #spiel{--dz-g:clamp(32px,9.6vw,38px);--dz-e:clamp(42px,12.6vw,50px)}
}
/* Sehr niedrige Bildschirme (Handy mit eingeblendeten Leisten des Browsers): enger, damit auch die unterste Tastenreihe ohne Scrollen sichtbar ist */
@media (max-height:600px){
  #spiel{--dz-th:44px;gap:6px;padding-top:2px}
  .dz-leiste{gap:4px}
  .dz-luecke{padding:2px 10px}
  .dz-abc span{padding:2px 0}
  .dz-bahn{height:14px}
  .dz-grenze{padding:6px 10px;gap:4px}
  .dz-mitte{padding:6px 10px;gap:5px}
}
@media (max-width:360px){
  .dz-kopf{font-size:.76rem;gap:6px}
  .dz-kopf b,.dz-kopf .dz-luecke b{font-size:.88rem}
  .dz-luecke{padding:3px 9px;gap:.25em}
}
@media (min-width:600px){
  .dz-tasten{--dz-tx:3px;width:calc(100% + 2*var(--dz-tx))!important;margin:calc(-1*var(--dz-ty)) calc(-1*var(--dz-tx))}
}
</style>
</head>
<body>
<main id="spiel">
  <div class="dz-kopf">
    <span id="dz-zaehler">Versuch <b>1</b> von 12</span>
    <span class="dz-luecke" id="dz-luecke">Lücke <b>100 %</b></span>
  </div>

  <div class="dz-leiste" id="dz-leiste" role="img" aria-label="Lücke im Alphabet: von A bis Z">
    <div class="dz-bahn"><div class="dz-band" id="dz-band"></div></div>
    <div class="dz-abc" id="dz-abc" aria-hidden="true"></div>
  </div>

  <section class="dz-zone" aria-label="Grenzen und Eingabe">
    <div class="dz-grenze" id="dz-oben" role="group" aria-label="Obere Grenze">
      <p class="dz-marke"><span aria-hidden="true">↑</span> früher im Alphabet</p>
      <div class="dz-wort"></div>
    </div>
    <div class="dz-mitte">
      <p class="dz-hier" id="dz-hier">hier dazwischen</p>
      <div class="dz-eingabe" id="dz-eingabe" role="group" aria-label="Deine Eingabe"></div>
      <p class="dz-tipp" id="dz-tipp"></p>
    </div>
    <div class="dz-grenze" id="dz-unten" role="group" aria-label="Untere Grenze">
      <div class="dz-wort"></div>
      <p class="dz-marke"><span aria-hidden="true">↓</span> später im Alphabet</p>
    </div>
  </section>

  <div class="dz-tasten" id="dz-tasten" role="group" aria-label="Tastatur"></div>

  <div class="dz-schluss" id="dz-schluss" hidden>
    <p class="gross" id="dz-schluss-text"></p>
    <p class="klein">Morgen wartet ein neues Wort.</p>
    <button type="button" class="rg-knopf haupt" id="dz-ergebnis">Ergebnis und Teilen</button>
  </div>

  <section class="dz-liste" aria-label="Bisherige Versuche">
    <h2>Deine Versuche</h2>
    <p id="dz-leer">Noch kein Versuch. Der Pfeil zeigt dir danach, wo das gesuchte Wort liegt: ↑ früher oder ↓ später im Alphabet.</p>
    <ol class="dz-versuche" id="dz-versuche"></ol>
  </section>

  <p class="dz-nur-vorlesen" id="dz-ansage" aria-live="polite"></p>
</main>

<script src="woerter.js"></script>
<script src="kern.js"></script>
<script>
/* Dazwischen – Eigenentwicklung von RG Ing. Consulting.
   Ein Wort mit 5 Buchstaben wird gesucht. Jeder Tipp wird zur neuen oberen oder unteren Grenze. */
(function () {
  'use strict';

  var MAX = 12, LAENGE = 5;
  var UMLAUT = { 'Ä': 'A', 'Ö': 'O', 'Ü': 'U' };
  var REIHEN = ['QWERTZUIOPÜ', 'ASDFGHJKLÖÄ', 'YXCVBNM'];

  /* ---------- Sortierung nach Wörterbuchregel (unabhängig von der Sprache des Browsers) ----------
     Ä zählt wie A, Ö wie O, Ü wie U. Sind zwei Wörter so gleich, steht das ohne Umlaut zuerst. */
  function grund(wort) {
    var s = String(wort).toUpperCase(), aus = '';
    for (var i = 0; i < s.length; i++) aus += UMLAUT[s.charAt(i)] || s.charAt(i);
    return aus;
  }
  function vergleiche(a, b) {
    var x = String(a).toUpperCase(), y = String(b).toUpperCase();
    var gx = grund(x), gy = grund(y), n = Math.min(gx.length, gy.length), i;
    for (i = 0; i < n; i++) {
      var cx = gx.charCodeAt(i), cy = gy.charCodeAt(i);
      if (cx !== cy) return cx < cy ? -1 : 1;
    }
    if (gx.length !== gy.length) return gx.length < gy.length ? -1 : 1;
    for (i = 0; i < x.length; i++) {
      if (x.charAt(i) !== y.charAt(i)) return UMLAUT[x.charAt(i)] ? 1 : -1;
    }
    return 0;
  }

  /* ---------- Rahmen und Tageswort ---------- */
  var REGELN =
    '<p>Gesucht ist ein Wort mit 5 Buchstaben. Du hast 12 Versuche.</p>' +
    '<ul>' +
    '<li>Tippe ein Wort. Du erfährst, ob das gesuchte Wort im Alphabet <b>↑ früher</b> oder <b>↓ später</b> kommt.</li>' +
    '<li>Dein Wort wird zur neuen Grenze: oben die frühere, unten die spätere. Das gesuchte Wort liegt immer dazwischen.</li>' +
    '<li>Beginnen beide Grenzen gleich, sind diese Buchstaben blau markiert und unterstrichen. So beginnt auch das gesuchte Wort.</li>' +
    '</ul>' +
    '<div class="dz-bsp" aria-label="Beispiel: Zwischen BLUME und BRIEF beginnt das Wort mit B">' +
    '<div class="dz-wort"><span class="dz-z fest">B</span><span class="dz-z">L</span><span class="dz-z">U</span><span class="dz-z">M</span><span class="dz-z">E</span></div>' +
    '<small>hier dazwischen</small>' +
    '<div class="dz-wort"><span class="dz-z fest">B</span><span class="dz-z">R</span><span class="dz-z">I</span><span class="dz-z">E</span><span class="dz-z">F</span></div>' +
    '</div>' +
    '<ul>' +
    '<li>Die Leiste A–Z zeigt die Lücke, die noch übrig ist. Blasse Tasten führen aus der Lücke hinaus.</li>' +
    '<li>Ein Wort ausserhalb der Grenzen, ein unbekanntes oder ein schon getipptes Wort kostet keinen Versuch.</li>' +
    '<li>Sortiert wird wie im Wörterbuch: Ä zählt wie A, Ö wie O, Ü wie U. Ein markiertes A kann also auch ein Ä sein.</li>' +
    '</ul>';

  var S = RG.rahmen({ id: 'dazwischen', regelnHtml: REGELN, tageswechsel: true });
  var W = window.RG_WOERTER || { loesungen: [], erlaubt: [] };
  var erlaubt = {};
  W.erlaubt.forEach(function (w) { erlaubt[w] = true; });
  W.loesungen.forEach(function (w) { erlaubt[w] = true; });

  var folge = RG.zufall('dazwischen-folge').misch(W.loesungen.slice().sort());
  var anzahl = folge.length;
  var loesung = folge[(((S.heute.nr - 1) % anzahl) + anzahl) % anzahl];

  /* ---------- Zustand ---------- */
  var versuche = [], eingabe = '', ende = false;
  var oben = null, unten = null;       // oben = früheres Wort, unten = späteres Wort

  var $ = function (id) { return document.getElementById(id); };
  var elZaehler = $('dz-zaehler'), elLuecke = $('dz-luecke'), elLeiste = $('dz-leiste'), elBand = $('dz-band'), elAbc = $('dz-abc');
  var elOben = $('dz-oben'), elUnten = $('dz-unten'), elEingabe = $('dz-eingabe'), elTipp = $('dz-tipp'), elHier = $('dz-hier');
  var elTasten = $('dz-tasten'), elSchluss = $('dz-schluss'), elVersuche = $('dz-versuche'), elLeer = $('dz-leer'), elAnsage = $('dz-ansage');

  function berechneGrenzen() {
    oben = null; unten = null;
    versuche.forEach(function (w) {
      var c = vergleiche(w, loesung);
      if (c < 0 && (!oben || vergleiche(w, oben) > 0)) oben = w;
      if (c > 0 && (!unten || vergleiche(w, unten) < 0)) unten = w;
    });
  }
  /** Anzahl gleicher Anfangsbuchstaben beider Grenzen (Umlaute wie Grundbuchstaben). */
  function gemeinsam() {
    if (!oben || !unten) return 0;
    var a = grund(oben), b = grund(unten), n = 0;
    while (n < LAENGE && a.charAt(n) === b.charAt(n)) n++;
    return n;
  }
  /** Lage eines Worts im Alphabet als Zahl von 0 bis 1. */
  function lage(wort) {
    var g = grund(wort), p = 0, f = 1;
    for (var i = 0; i < g.length; i++) { f /= 26; p += Math.max(0, Math.min(25, g.charCodeAt(i) - 65)) * f; }
    return p;
  }
  /** Kann ein Wort mit diesem Anfang überhaupt in der Lücke liegen? */
  function passt(anfang) {
    var klein = anfang, gross = anfang;
    while (klein.length < LAENGE) { klein += 'A'; gross += 'Z'; }
    return (!oben || vergleiche(gross, oben) > 0) && (!unten || vergleiche(klein, unten) < 0);
  }

  /* ---------- Anzeige ---------- */
  function zeigeGrenze(feld, wort, n, platzhalterHtml) {
    var ziel = feld.querySelector('.dz-wort');
    ziel.innerHTML = '';
    if (!wort) {
      ziel.innerHTML = '<span class="dz-offen">' + platzhalterHtml + '</span>';
      feld.setAttribute('data-wort', '');
      feld.setAttribute('aria-label', feld === elOben ? 'Obere Grenze: noch offen, Anfang des Alphabets' : 'Untere Grenze: noch offen, Ende des Alphabets');
      return;
    }
    for (var i = 0; i < wort.length; i++) ziel.appendChild(RG.el('span', { class: 'dz-z' + (i < n ? ' fest' : '') }, wort.charAt(i)));
    feld.setAttribute('data-wort', wort);
    feld.setAttribute('aria-label', (feld === elOben ? 'Obere Grenze: ' : 'Untere Grenze: ') + wort);
  }

  function zeigeLeiste() {
    var getroffen = ende && versuche[versuche.length - 1] === loesung;
    var a = oben ? lage(oben) : 0, b = unten ? lage(unten) : 1;
    if (getroffen) { a = lage(loesung); b = a; }
    var breite = Math.max(b - a, 0), anteil = breite * 100;
    var sichtbar = Math.max(anteil, 1.8), links = Math.min(a * 100, 100 - sichtbar);
    elBand.style.left = links.toFixed(3) + '%';
    elBand.style.width = sichtbar.toFixed(3) + '%';
    var von = oben ? grund(oben).charAt(0) : 'A', bis = unten ? grund(unten).charAt(0) : 'Z';
    if (getroffen) { von = grund(loesung).charAt(0); bis = von; }
    var spans = elAbc.children;
    for (var i = 0; i < spans.length; i++) {
      var c = String.fromCharCode(65 + i);
      spans[i].className = (c >= von && c <= bis) ? 'drin' : '';
    }
    var text = anteil >= 9.95 ? Math.round(anteil) + ' %' : anteil >= 1 ? anteil.toFixed(1).replace('.', ',') + ' %' : anteil >= 0.01 ? anteil.toFixed(2).replace('.', ',') + ' %' : 'unter 0,01 %';
    if (getroffen) {
      elLuecke.innerHTML = '<b>◎ getroffen</b>';
      elLeiste.setAttribute('aria-label', 'Das gesuchte Wort ' + loesung + ' ist gefunden');
      return;
    }
    elLuecke.innerHTML = 'Lücke <b>' + text + '</b>';
    elLeiste.setAttribute('aria-label', 'Lücke im Alphabet: von ' + (oben || 'A') + ' bis ' + (unten || 'Z') + ', ' + text + ' des Alphabets');
  }

  function zeigeTipp(n) {
    if (ende) { elTipp.textContent = ''; return; }
    var go = oben ? grund(oben) : '', gu = unten ? grund(unten) : '';
    var von = oben ? go.charAt(n) : 'A', bis = unten ? gu.charAt(n) : 'Z';
    var bereich = von === bis ? '<b>' + von + '</b>' : '<b>' + von + '</b> bis <b>' + bis + '</b>';
    if (!oben && !unten) { elTipp.innerHTML = 'Alles offen: <b>A</b> bis <b>Z</b>'; return; }
    if (n === 0) { elTipp.innerHTML = '1. Buchstabe: ' + bereich; return; }
    // Beide Grenzen unterscheiden sich nur noch durch Umlaute (z. B. APFEL und ÄPFEL).
    if (n >= LAENGE) { elTipp.innerHTML = 'Nur noch <b>' + go + '</b> mit Umlaut möglich'; return; }
    elTipp.innerHTML = 'Anfang <b>' + go.slice(0, n) + '</b> fest · ' + (n + 1) + '. Buchstabe ' + bereich;
  }

  function zeigeEingabe(n) {
    var zellen = elEingabe.children, go = oben ? grund(oben) : '';
    for (var i = 0; i < LAENGE; i++) {
      var z = zellen[i], k = 'dz-e';
      if (ende) {
        z.textContent = loesung.charAt(i);
        k += versuche[versuche.length - 1] === loesung ? ' treffer' : ' verpasst';
      } else if (i < eingabe.length) {
        z.textContent = eingabe.charAt(i); k += ' voll';
      } else {
        z.textContent = i < n ? go.charAt(i) : '';
        if (i < n) k += ' geist';
        if (i === eingabe.length) k += ' jetzt';
      }
      if (z.className !== k) z.className = k;
    }
    elEingabe.setAttribute('aria-label', ende ? 'Gesuchtes Wort: ' + loesung : 'Deine Eingabe: ' + (eingabe || 'leer') + ', ' + eingabe.length + ' von ' + LAENGE + ' Buchstaben');
  }

  function zeigeTasten() {
    var tasten = elTasten.querySelectorAll('[data-taste]');
    for (var i = 0; i < tasten.length; i++) {
      var t = tasten[i].getAttribute('data-taste');
      if (t.length !== 1) continue;
      var fern = !ende && eingabe.length < LAENGE && !passt(eingabe + t);
      tasten[i].classList.toggle('fern', fern);
      tasten[i].setAttribute('aria-label', fern ? t + ', führt aus der Lücke hinaus' : t);
    }
  }

  function zeigeListe(frisch) {
    elVersuche.innerHTML = '';
    elLeer.hidden = versuche.length > 0;
    for (var i = versuche.length - 1; i >= 0; i--) {
      var w = versuche[i], c = vergleiche(w, loesung);
      var richtung = c === 0 ? 'treffer' : c < 0 ? 'spaeter' : 'frueher';
      var li = RG.el('li', { 'data-richtung': richtung, 'data-wort': w });
      if (frisch && i === versuche.length - 1) li.className = 'frisch';
      li.appendChild(RG.el('span', { class: 'nr' }, (i + 1) + '.'));
      li.appendChild(RG.el('span', { class: 'w' }, w));
      var pf = RG.el('span', { class: 'pf' });
      pf.innerHTML = richtung === 'treffer' ? '<i aria-hidden="true">◎</i> getroffen' : richtung === 'spaeter' ? '<i aria-hidden="true">↓</i> später' : '<i aria-hidden="true">↑</i> früher';
      li.appendChild(pf);
      elVersuche.appendChild(li);
    }
  }

  function zeige(frisch) {
    var n = gemeinsam();
    zeigeGrenze(elOben, oben, n, '<b>A</b> …');
    zeigeGrenze(elUnten, unten, n, '… <b>Z</b>');
    zeigeLeiste();
    zeigeTipp(n);
    zeigeEingabe(n);
    zeigeTasten();
    zeigeListe(frisch);
    var getroffen = versuche[versuche.length - 1] === loesung;
    if (ende) {
      elZaehler.innerHTML = '<b>' + versuche.length + '</b> von ' + MAX + ' Versuchen';
      elHier.textContent = getroffen ? '◎ getroffen' : '✕ gesucht war';
      elTasten.hidden = true;
      elSchluss.hidden = false;
      $('dz-schluss-text').textContent = getroffen
        ? (versuche.length === 1 ? 'Volltreffer im ersten Versuch!' : 'Getroffen in ' + versuche.length + ' von ' + MAX + ' Versuchen.')
        : 'Nicht getroffen. Gesucht war ' + loesung + '.';
    } else {
      elZaehler.innerHTML = 'Versuch <b>' + (versuche.length + 1) + '</b> von ' + MAX;
    }
  }

  /* ---------- Spielzüge ---------- */
  /* Ohne Versuch und ohne Eingabe gilt das Rätsel als unberührt (null): Die Übersicht zeigt dann «offen» statt
     «angefangen», und der Rahmen darf am nächsten Tag das neue Rätsel laden. */
  function sichere() { S.sichereStand(versuche.length || eingabe ? { versuche: versuche.slice(), eingabe: eingabe, ziel: loesung } : null); }

  function ablehnen(text) {
    RG.toast(text, 2200);
    elEingabe.classList.remove('wackel');
    void elEingabe.offsetWidth;
    elEingabe.classList.add('wackel');
  }

  function tippe(buchstabe) {
    if (ende || eingabe.length >= LAENGE) return;
    eingabe += buchstabe;
    sichere();
    var n = gemeinsam(); zeigeEingabe(n); zeigeTasten();
  }
  function loesche() {
    if (ende || !eingabe) return;
    eingabe = eingabe.slice(0, -1);
    sichere();
    var n = gemeinsam(); zeigeEingabe(n); zeigeTasten();
  }

  function teilenText(getroffen) {
    var pfeile = versuche.filter(function (w) { return w !== loesung; })
      .map(function (w) { return vergleiche(w, loesung) < 0 ? '↓' : '↑'; }).join('');
    return 'Dazwischen Nr. ' + S.heute.nr + ' ' + (getroffen ? versuche.length : '✕') + '/' + MAX + '\n' + pfeile + (getroffen ? '◎' : '✕');
  }

  function abschluss(sofort) {
    var getroffen = versuche[versuche.length - 1] === loesung;
    ende = true;
    S.fertig({
      gewonnen: getroffen,
      wert: versuche.length,
      teilenText: teilenText(getroffen),
      detailHtml: getroffen
        ? 'Das Wort war <b>' + loesung + '</b>. Du hast es in ' + versuche.length + ' von ' + MAX + ' Versuchen eingekreist.'
        : 'Gesucht war <b>' + loesung + '</b>. Es lag zwischen ' + (oben || 'A') + ' und ' + (unten || 'Z') + '.',
      verzoegerung: sofort ? 600 : 1300
    });
  }

  var angenommenUm = 0;                // Zeitpunkt des letzten angenommenen Worts
  function sende() {
    if (ende) return;
    if (eingabe.length < LAENGE) {
      if (!eingabe && Date.now() - angenommenUm < 800) return;   // Doppeltipp auf «Eingabe»: keine falsche Meldung
      ablehnen('Noch nicht 5 Buchstaben'); return;
    }
    var w = eingabe;
    if (!erlaubt[w]) { ablehnen('Dieses Wort kenne ich nicht'); return; }
    if (versuche.indexOf(w) >= 0) { ablehnen(w + ' hast du schon getippt'); return; }
    if (oben && vergleiche(w, oben) <= 0) { ablehnen('Ausserhalb: ' + w + ' steht vor ' + oben); return; }
    if (unten && vergleiche(w, unten) >= 0) { ablehnen('Ausserhalb: ' + w + ' steht nach ' + unten); return; }

    versuche.push(w);
    eingabe = '';
    angenommenUm = Date.now();
    var c = vergleiche(w, loesung);
    berechneGrenzen();
    sichere();
    if (c === 0 || versuche.length >= MAX) ende = true;
    zeige(true);
    if (c === 0) {
      elEingabe.classList.add('jubel');
      elAnsage.textContent = w + ' ist richtig. Getroffen in ' + versuche.length + ' Versuchen.';
      abschluss(false);
      return;
    }
    var feld = c < 0 ? elOben : elUnten, klasse = c < 0 ? 'neu-oben' : 'neu-unten';
    feld.classList.remove(klasse); void feld.offsetWidth; feld.classList.add(klasse);
    elAnsage.textContent = w + ': Das gesuchte Wort kommt ' + (c < 0 ? 'später' : 'früher') + ' im Alphabet.';
    if (ende) { elAnsage.textContent += ' Keine Versuche mehr. Gesucht war ' + loesung + '.'; abschluss(false); }
  }

  /* ---------- Aufbau ---------- */
  (function baue() {
    var i;
    for (i = 0; i < 26; i++) elAbc.appendChild(RG.el('span', null, String.fromCharCode(65 + i)));
    for (i = 0; i < LAENGE; i++) elEingabe.appendChild(RG.el('span', { class: 'dz-e' }));
    REIHEN.forEach(function (reihe, r) {
      var zeile = RG.el('div', { class: 'dz-reihe' });
      if (r === 2) zeile.appendChild(RG.el('button', { type: 'button', class: 'dz-taste breit los', 'data-taste': 'Eingabe', 'aria-label': 'Eingabe: Wort prüfen' }, 'Eingabe'));
      reihe.split('').forEach(function (b) { zeile.appendChild(RG.el('button', { type: 'button', class: 'dz-taste', 'data-taste': b, 'aria-label': b }, b)); });
      if (r === 2) zeile.appendChild(RG.el('button', { type: 'button', class: 'dz-taste breit', 'data-taste': 'Löschen', 'aria-label': 'Löschen: letzten Buchstaben entfernen' }, 'Löschen'));
      elTasten.appendChild(zeile);
    });
  })();

  elTasten.addEventListener('mousedown', function (ev) { ev.preventDefault(); });   // Fokus bleibt frei für die echte Tastatur
  elTasten.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-taste]') : null;
    if (!t) return;
    var k = t.getAttribute('data-taste');
    if (k === 'Eingabe') sende(); else if (k === 'Löschen') loesche(); else tippe(k);
  });
  /* Wer mit Tab durch die Seite geht, bedient Knöpfe mit Enter. Wer einen Knopf nur angeklickt hat
     (z. B. «?» und das Fenster wieder geschlossen), will mit Enter sein Wort prüfen: dann gibt das Spiel den Fokus frei. */
  var tabFokus = false;
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Tab') tabFokus = true; }, true);
  document.addEventListener('pointerdown', function () { tabFokus = false; }, true);
  function gibFokusFrei() {
    var a = document.activeElement;
    if (!tabFokus && a && a !== document.body && a.blur && a.closest && a.closest('button, a')) a.blur();
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || ende) return;
    if (document.querySelector('dialog[open]')) return;
    var k = ev.key, ziel = ev.target;
    if (k === 'Enter') {
      if (tabFokus && ziel && ziel.closest && ziel.closest('button, a')) return;   // mit Tab gewählter Knopf löst sich selbst aus
      ev.preventDefault();
      if (ev.repeat) return;                                                         // gehaltene Taste zählt einmal
      gibFokusFrei(); sende(); return;
    }
    if (k === 'Backspace') { ev.preventDefault(); gibFokusFrei(); loesche(); return; }
    if (k && k.length === 1) {
      var g = k.toUpperCase();
      if (/^[A-ZÄÖÜ]$/.test(g)) { ev.preventDefault(); gibFokusFrei(); tippe(g); }
    }
  });
  $('dz-ergebnis').addEventListener('click', function () { S.zeigeErgebnis(); });

  /* ---------- Stand laden ---------- */
  (function lade() {
    var stand = S.ladeStand(), fertig = S.ergebnis(), FORM = /^[A-ZÄÖÜ]{5}$/;
    if (stand && Array.isArray(stand.versuche)) {
      stand.versuche.forEach(function (w) {
        if (typeof w === 'string' && FORM.test(w) && versuche.indexOf(w) < 0 && versuche.length < MAX) versuche.push(w);
      });
      if (!fertig && typeof stand.eingabe === 'string' && /^[A-ZÄÖÜ]{0,5}$/.test(stand.eingabe)) eingabe = stand.eingabe;
    }
    // Ein begonnenes oder beendetes Spiel behält sein Wort, auch wenn die Wortliste am selben Tag gewachsen ist.
    var zielAlt = stand && typeof stand.ziel === 'string' && FORM.test(stand.ziel) ? stand.ziel : '';
    if (zielAlt && (fertig || (versuche.length && erlaubt[zielAlt]))) loesung = zielAlt;
    else if (fertig && fertig.gewonnen && versuche.length) loesung = versuche[versuche.length - 1];   // alter Stand ohne Wort: der letzte Versuch war der Treffer
    var treffer = versuche.indexOf(loesung);
    if (treffer >= 0) versuche = versuche.slice(0, treffer + 1);                                       // nach dem Treffer kommt nichts mehr
    berechneGrenzen();
    if (fertig) { ende = true; eingabe = ''; zeige(false); return; }
    var offenesEnde = versuche.length && (versuche[versuche.length - 1] === loesung || versuche.length >= MAX);
    if (offenesEnde) { eingabe = ''; ende = true; zeige(false); abschluss(true); return; }
    zeige(false);
  })();

  window.RG_TEST = { loesung: loesung, vergleiche: vergleiche };
})();
</script>
</body>
</html>
